[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "find-good-room-server"
version = "0.1.0"
description = "城中村租房平台 API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pymysql>=1.1",
    "cryptography>=42",
    "alembic>=1.13",
    "pyjwt>=2.8",
    "bcrypt>=4.1",
    "pillow>=10",
    "python-multipart>=0.0.9",
]

[tool.setuptools.packages.find]
include = ["app*", "scripts*"]
